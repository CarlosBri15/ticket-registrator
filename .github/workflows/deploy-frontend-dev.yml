name: Dev Deployment (Frontend)

on:
  push:
    branches:
      - dev
    paths:
      - 'packages/frontend/**'
      - 'packages/shared/**'
      - '.github/workflows/deploy-frontend-dev.yml'

jobs:
  ci-frontend:
    name: CI (frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm install
      - name: Build Shared Package
        run: npm run build -w @ticket-registrator/shared
      - name: Run Linter
        continue-on-error: true
        working-directory: packages/frontend
        run: npm run lint
      - name: Run Unit Tests
        working-directory: packages/frontend
        run: npm test -- --coverage --watchAll=false
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        with:
          projectBaseDir: packages/frontend
          args: >
            -Dsonar.qualitygate.wait=true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  deploy-frontend:
    name: Deploy Frontend
    needs: ci-frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Create .env file
        run: echo "VITE_API_URL=${{ secrets.VITE_API_URL_DEV }}" > ./packages/frontend/.env.production
      - name: Install and Build
        run: |
          npm ci
          npm run build -w @ticket-registrator/shared
          npm run build -w frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL_DEV }}
          VITE_ENV: dev
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_TICKET_REGISTRATOR }}'
          projectId: ticket-registrator
          target: dev
          channelId: live
          entryPoint: "./packages/frontend"

  notify:
    name: Notifications
    needs: [ci-frontend, deploy-frontend]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Notify Discord Success
        if: needs.deploy-frontend.result == 'success'
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_DEV_UPDATES }}
          status: success
          content: "@everyone 🚀 **Frontend de `dev` actualizado**"
          title: "📌 ${{ github.event.head_commit.message }}"
          description: |
            **Autor:** ${{ github.actor }}
            **Estado:** CI pasado ✅ | Deployed ✅
          url: "${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}"
          color: 0x2ecc71
      - name: Notify Discord Failure
        if: needs.ci-frontend.result == 'failure' || needs.deploy-frontend.result == 'failure'
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
          status: failure
          content: "@here 🚨 **Pipeline de Frontend en `dev` FALLIDO**"
          title: "Error en el flujo de integración/despliegue (Frontend)"
          url: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          color: 0xff0000
