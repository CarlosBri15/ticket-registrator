name: Deploy Backend to DEV

on:
  push:
    branches:
      - dev
    paths:
      - 'packages/backend/**'
      - 'packages/shared/**'
      - '.github/workflows/backend-dev.yml'

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: us-central1
  REPO_NAME: backend-ticket-registrator
  SERVICE_NAME: dev-ticket-registrator
  WIF_PROVIDER: 'projects/785450442855/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
  WIF_SERVICE_ACCOUNT: 'github-deployer@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com'

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - id: 'auth'
        name: 'Authenticate to Google Cloud'
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}
          token_format: 'access_token'

      - name: 'Configure Docker Auth'
        run: |-
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      - name: 'Build and Push Container'
        run: |-
          docker build -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/backend:${{ github.sha }} -f packages/backend/Dockerfile .
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/backend:${{ github.sha }}
          
      - id: 'deploy'
        name: 'Deploy to Cloud Run'
        uses: 'google-github-actions/deploy-cloudrun@v2'
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/backend:${{ github.sha }}
          env_vars: |-
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
            DATABASE_URL=${{ secrets.DATABASE_URL_DEV }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            GCP_PROJECT_ID=${{ secrets.GCP_PROJECT_ID }}
            GCP_BUCKET_NAME=${{ secrets.GCP_BUCKET_NAME }}
            NODE_ENV=production
          flags: '--allow-unauthenticated --port=8080 --timeout=60s --cpu-boost'

      - name: 'Show Deployment URL'
        run: echo "Tu API está lista en ${{ steps.deploy.outputs.url }}"

      - name: Notify Deployment (Discord)
        if: success()
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_DEV_DEPLOY }}
          status: ${{ job.status }}
          title: "🚀 Backend Deployed to DEV"
          description: "La API del backend se ha desplegado correctamente en Google Cloud Run."
          color: 0x2ecc71
          url: "${{ steps.deploy.outputs.url }}"

      - name: Notify Alert on Failure (Discord)
        if: failure()
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
          status: ${{ job.status }}
          content: "@here 🚨 **ERROR CRÍTICO**: El despliegue de Backend en DEV ha fallado."
          title: "DEPLOYMENT FAILURE: Backend (DEV)"
          description: "No se ha podido completar la actualización en Cloud Run."
          color: 0xff0000