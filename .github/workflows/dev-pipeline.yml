name: Dev Deployment Pipeline

on:
  push:
    branches:
      - dev

jobs:
  # 0. Detect Changes
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      mobile: ${{ steps.filter.outputs.mobile }}
      shared: ${{ steps.filter.outputs.shared }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'packages/backend/**'
              - 'packages/shared/**'
            frontend:
              - 'packages/frontend/**'
              - 'packages/shared/**'
            mobile:
              - 'packages/mobile/**'
              - 'packages/shared/**'
            shared:
              - 'packages/shared/**'

  # 1. CI Jobs per project
  ci-backend:
    name: CI (backend)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm install
      - name: Build Shared Package
        run: npm run build -w @ticket-registrator/shared
      - name: Run Linter
        continue-on-error: false
        working-directory: packages/backend
        run: npm run lint
      - name: Run Unit Tests
        working-directory: packages/backend
        run: npm test -- --coverage --watchAll=false
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        with:
          projectBaseDir: packages/backend
          args: >
            -Dsonar.qualitygate.wait=true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  ci-frontend:
    name: CI (frontend)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm install
      - name: Build Shared Package
        run: npm run build -w @ticket-registrator/shared
      - name: Run Linter
        continue-on-error: true
        working-directory: packages/frontend
        run: npm run lint
      - name: Run Unit Tests
        working-directory: packages/frontend
        run: npm test -- --coverage --watchAll=false
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        with:
          projectBaseDir: packages/frontend
          args: >
            -Dsonar.qualitygate.wait=true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  ci-mobile:
    name: CI (mobile)
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm install
      - name: Build Shared Package
        run: npm run build -w @ticket-registrator/shared
      - name: Run Linter
        continue-on-error: true
        working-directory: packages/mobile
        run: npm run lint
      - name: Run Unit Tests
        working-directory: packages/mobile
        run: npm test -- --coverage --watchAll=false
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        with:
          projectBaseDir: packages/mobile
          args: >
            -Dsonar.qualitygate.wait=true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  ci-shared:
    name: CI (shared)
    needs: changes
    if: needs.changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm install
      - name: Build Shared Package
        run: npm run build -w @ticket-registrator/shared
      - name: Run Linter
        continue-on-error: true
        working-directory: packages/shared
        run: npm run lint
      - name: Run Unit Tests
        working-directory: packages/shared
        run: npm test -- --coverage --watchAll=false
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        with:
          projectBaseDir: packages/shared
          args: >
            -Dsonar.qualitygate.wait=true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # 2. Deploy Backend
  deploy-backend:
    name: Deploy Backend
    needs: [changes, ci-backend]
    if: always() && needs.changes.outputs.backend == 'true' && (needs.ci-backend.result == 'success' || needs.ci-backend.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'
    steps:
      - uses: actions/checkout@v4
      - id: 'auth'
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: 'projects/785450442855/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'github-deployer@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com'
          token_format: 'access_token'
      - name: 'Configure Docker Auth'
        run: gcloud auth configure-docker us-central1-docker.pkg.dev
      - name: 'Build and Push Container'
        run: |-
          docker build -t us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/backend-ticket-registrator/backend:${{ github.sha }} -f packages/backend/Dockerfile .
          docker push us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/backend-ticket-registrator/backend:${{ github.sha }}
      - id: 'deploy'
        uses: 'google-github-actions/deploy-cloudrun@v2'
        with:
          service: dev-ticket-registrator
          region: us-central1
          image: us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/backend-ticket-registrator/backend:${{ github.sha }}
          env_vars: |-
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
            DATABASE_URL=${{ secrets.DATABASE_URL_DEV }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            GCP_PROJECT_ID=${{ secrets.GCP_PROJECT_ID }}
            GCP_BUCKET_NAME=${{ secrets.GCP_BUCKET_NAME }}
            NODE_ENV=production

  # 3. Deploy Frontend
  deploy-frontend:
    name: Deploy Frontend
    needs: [changes, ci-frontend]
    if: always() && needs.changes.outputs.frontend == 'true' && (needs.ci-frontend.result == 'success' || needs.ci-frontend.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Create .env file
        run: echo "VITE_API_URL=${{ secrets.VITE_API_URL_DEV }}" > ./packages/frontend/.env.dev
      - name: Install and Build
        run: |
          npm ci
          npm run build -w @ticket-registrator/shared
          npm run build -w frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL_DEV }}
          VITE_ENV: dev
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_TICKET_REGISTRATOR }}'
          projectId: ticket-registrator
          target: dev
          channelId: live
          entryPoint: "./packages/frontend"

  # 4. Final Notification (ONLY ON SUCCESS)
  notify-success:
    name: Notify Success
    needs: [deploy-backend, deploy-frontend]
    runs-on: ubuntu-latest
    if: success()
    steps:
      - name: Notify Discord
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_DEV_UPDATES }}
          status: ${{ job.status }}
          content: "@everyone 🚀 **Entorno de `dev` actualizado y verificado**"
          title: "📌 ${{ github.event.head_commit.message }}"
          description: |
            **Autor:** ${{ github.actor }}
            **Estado:** Tests pasados ✅ | Deployed ✅
            
            Los cambios ya están disponibles. Por favor, haced un `git pull` para sincronizar.
          url: "${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}"
          color: 0x2ecc71

  # 5. Alert on Failure (ANY PART)
  notify-failure:
    name: Notify Failure
    needs: [ci-backend, ci-frontend, ci-mobile, ci-shared, deploy-backend, deploy-frontend]
    runs-on: ubuntu-latest
    if: failure()
    steps:
      - name: Notify Discord
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
          status: failure
          content: "@here 🚨 **Pipeline de `dev` FALLIDO**"
          title: "Error en el flujo de integración/despliegue"
          description: "Un paso crítico ha fallado. El entorno de `dev` podría estar inestable. Revisa los logs de GitHub Actions."
          url: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          color: 0xff0000
