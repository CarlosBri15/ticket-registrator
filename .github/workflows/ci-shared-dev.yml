name: CI (Shared Package)

on:
  push:
    branches:
      - dev
    paths:
      - 'packages/shared/**'
      - '.github/workflows/ci-shared-dev.yml'

jobs:
  ci-shared:
    name: CI (shared)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm install
      - name: Build Shared Package
        run: npm run build -w @ticket-registrator/shared
      - name: Run Linter
        continue-on-error: true
        working-directory: packages/shared
        run: npm run lint
      - name: Run Unit Tests
        working-directory: packages/shared
        run: npm test -- --coverage --watchAll=false
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        with:
          projectBaseDir: packages/shared
          args: >
            -Dsonar.qualitygate.wait=true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  notify:
    name: Notifications
    needs: ci-shared
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Notify Discord Success
        if: needs.ci-shared.result == 'success'
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_DEV_UPDATES }}
          status: success
          content: "@everyone 📦 **Paquete `shared` actualizado y verificado**"
          title: "📌 ${{ github.event.head_commit.message }}"
          description: |
            **Autor:** ${{ github.actor }}
            **Estado:** Test & Sonar OK ✅
          url: "${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}"
          color: 0x3498db
      - name: Notify Discord Failure
        if: needs.ci-shared.result == 'failure'
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
          status: failure
          content: "@here 🚨 **Pipeline de Shared en `dev` FALLIDO**"
          title: "Error en el flujo de integración (Shared)"
          url: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          color: 0xff0000
