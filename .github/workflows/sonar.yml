name: SonarQube Monorepo Analysis

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - dev 

jobs:
  sonarcloud:
    name: Analyze ${{ matrix.project }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [backend, frontend, mobile, shared]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Build Shared Package
        run: npm run build -w @ticket-registrator/shared

      - name: Run Linter
        continue-on-error: true
        working-directory: packages/${{ matrix.project }}
        run: npm run lint

      - name: Run Unit Tests
        working-directory: packages/${{ matrix.project }}
        run: npm test -- --coverage --watchAll=false

      - name: SonarCloud Scan (${{ matrix.project }})
        uses: SonarSource/sonarcloud-github-action@master
        with:
          projectBaseDir: packages/${{ matrix.project }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Notify CI Status (Discord)
        if: always()
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_CI }}
          status: ${{ job.status }}
          title: "CI: ${{ matrix.project }}"
          description: "Tests and Lint analysis completed."
          nodetails: true

      - name: Notify Sonar Scan (Discord)
        if: success()
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_SONAR }}
          status: ${{ job.status }}
          title: "SonarCloud Analysis: ${{ matrix.project }}"
          description: "Analysis sent to SonarCloud successfully."
          color: 0x3498db

      - name: Notify Alert on Failure (Discord)
        if: failure()
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
          status: ${{ job.status }}
          content: "@here ⚠️ El flujo de CI ha fallado en el paquete **${{ matrix.project }}**"
          title: "CI FAILURE: ${{ matrix.project }}"
          description: "Revisa los logs para más detalles."
          color: 0xff0000