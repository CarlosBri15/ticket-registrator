name: Dev Deployment (Backend)

on:
  push:
    branches:
      - dev
    paths:
      - 'packages/backend/**'
      - 'packages/shared/**'
      - '.github/workflows/deploy-backend-dev.yml'

jobs:
  ci-backend:
    name: CI (backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm install
      - name: Build Shared Package
        run: npm run build -w @ticket-registrator/shared
      - name: Run Linter
        continue-on-error: true
        working-directory: packages/backend
        run: npm run lint
      - name: Run Unit Tests
        working-directory: packages/backend
        run: npm test -- --coverage --watchAll=false
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        with:
          projectBaseDir: packages/backend
          args: >
            -Dsonar.qualitygate.wait=true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  deploy-backend:
    name: Deploy Backend
    needs: ci-backend
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'
    steps:
      - uses: actions/checkout@v4
      - id: 'auth'
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: 'projects/785450442855/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'github-deployer@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com'
          token_format: 'access_token'
      - name: 'Configure Docker Auth'
        run: gcloud auth configure-docker us-central1-docker.pkg.dev
      - name: 'Build and Push Container'
        run: |-
          docker build -t us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/backend-ticket-registrator/backend:${{ github.sha }} -f packages/backend/Dockerfile .
          docker push us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/backend-ticket-registrator/backend:${{ github.sha }}
      - id: 'deploy'
        uses: 'google-github-actions/deploy-cloudrun@v2'
        with:
          service: dev-ticket-registrator
          region: us-central1
          image: us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/backend-ticket-registrator/backend:${{ github.sha }}
          env_vars: |-
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
            DATABASE_URL=${{ secrets.DATABASE_URL_DEV }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            GCP_PROJECT_ID=${{ secrets.GCP_PROJECT_ID }}
            GCP_BUCKET_NAME=${{ secrets.GCP_BUCKET_NAME }}
            PASSWORD_PEPPER=${{ secrets.PASSWORD_PEPPER }}
            NODE_ENV=production

  notify:
    name: Notifications
    needs: [ci-backend, deploy-backend]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Notify Discord Success
        if: needs.deploy-backend.result == 'success'
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_DEV_UPDATES }}
          status: success
          content: "@everyone 🚀 **Backend de `dev` actualizado**"
          title: "📌 ${{ github.event.head_commit.message }}"
          description: |
            **Autor:** ${{ github.actor }}
            **Estado:** CI pasado ✅ | Deployed ✅
          url: "${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}"
          color: 0x2ecc71
      - name: Notify Discord Failure
        if: needs.ci-backend.result == 'failure' || needs.deploy-backend.result == 'failure'
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
          status: failure
          content: "@here 🚨 **Pipeline de Backend en `dev` FALLIDO**"
          title: "Error en el flujo de integración/despliegue (Backend)"
          url: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          color: 0xff0000
