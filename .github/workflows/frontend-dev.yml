name: Deploy Frontend to DEV

on:
  push:
    branches:
      - dev
    paths:
      - 'packages/frontend/**'
      - 'packages/shared/**'
      - '.github/workflows/frontend-dev.yml'

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Create .env file
        run: echo "VITE_API_URL=${{ secrets.VITE_API_URL_DEV }}" > ./packages/frontend/.env.dev
      - name: Install and Build
        run: |
          npm ci
          npm run build -w @ticket-registrator/shared
          npm run build -w frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL_DEV }}
          VITE_ENV: dev
      - uses: FirebaseExtended/action-hosting-deploy@v0
        id: deploy
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_TICKET_REGISTRATOR }}'
          projectId: ticket-registrator
          target: dev
          channelId: live
          entryPoint: "./packages/frontend"

      - name: Notify Deployment (Discord)
        if: success()
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_DEV_DEPLOY }}
          status: ${{ job.status }}
          title: "💻 Frontend Deployed to DEV"
          description: "La interfaz web se ha desplegado correctamente en Firebase Hosting (DEV).\n\nURL: https://ticket-registrator-dev.web.app"
          color: 0x2ecc71
          url: "https://ticket-registrator-dev.web.app"

      - name: Notify Alert on Failure (Discord)
        if: failure()
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
          status: ${{ job.status }}
          content: "@here 🚨 **ERROR CRÍTICO**: El despliegue del Frontend en DEV ha fallado."
          title: "DEPLOYMENT FAILURE: Frontend (DEV)"
          description: "La actualización en Firebase Hosting no se ha completado."
          color: 0xff0000
