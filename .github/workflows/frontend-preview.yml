name: Deploy Frontend PREVIEW

on:
  pull_request:
    branches:
      - main
    paths:
      - 'packages/frontend/**'
      - 'packages/shared/**'

jobs:
  build_and_preview:
    if: '${{ github.event.pull_request.head.repo.full_name == github.repository }}'
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      checks: write
      pull-requests: write

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - uses: actions/checkout@v3
      - name: Create .env file
        run: echo "VITE_API_URL=${{ secrets.VITE_API_URL_DEV }}" > ./frontend/.env.dev
      - name: Install and Build
        run: |
          npm ci
          npm run build -w shared
          npm run build -w frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL_DEV }}
          VITE_ENV: dev
      
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_TICKET_REGISTRATOR }}'
          projectId: ticket-registrator
          target: dev
          entryPoint: "./frontend"
