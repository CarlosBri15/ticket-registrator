version: '3'
services:

  postgres:
    image: pgvector/pgvector:pg15
    container_name: postgres_ticket_registrator
    restart: always
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: ${DB_PASSWORD:-root}
      POSTGRES_DB: ticket_registrator
    ports:
      - 5432:5432
    volumes:
      - ./postgres-data:/var/lib/postgresql/data