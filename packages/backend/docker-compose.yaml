version: '3'
services:
  mongodb:
    image: mongodb/mongodb-community-server:8.0-ubi8
    container_name: mongo_ticket_registrator
    restart: always
    ports:
      - 27017:27017
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./mongo-data:/data/db